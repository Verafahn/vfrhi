name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: "0.17.1"

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.optimize }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        optimize:
          - Debug
          - ReleaseFast
          - ReleaseSafe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
          use-cache: true
          cache-key: ${{ matrix.optimize }}

      - name: Show Zig version
        run: zig version

      - name: Build project
        run: zig build -Doptimize=${{ matrix.optimize }} --summary all

      - name: Run test
        run: zig build test -Doptimize=${{ matrix.optimize }} --summary all
